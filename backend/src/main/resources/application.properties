spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api/docs/openapi
springdoc.swagger-ui.path=/api/docs

bookflow.business-time-zone=${BUSINESS_TIME_ZONE:UTC}
bookflow.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
bookflow.security.jwt.secret=${JWT_SECRET}
bookflow.security.jwt.issuer=${JWT_ISSUER:bookflow}
bookflow.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}