spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

bookflow.security.jwt.secret=${JWT_SECRET}
bookflow.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}